# VirtualHost Apache — CRMIX DEV (DocumentRoot = racine du repo = /current).
<VirtualHost *:80>
    ServerName crmix.dev
    DocumentRoot /var/www/html/current

    # Derrière l'edge : Traefik pose X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    Timeout 300

    <Directory "/var/www/html/current">
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        Options -Indexes
    </Directory>

    # Thème Metronic monté en lecture seule (Alias /metronic -> assets réels).
    Alias /metronic /var/www/theme/metronic_v4.7.5/theme/assets
    <Directory "/var/www/theme/metronic_v4.7.5/theme/assets">
        Require all granted
        Options FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
