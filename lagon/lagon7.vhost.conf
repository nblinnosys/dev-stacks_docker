# VirtualHost Apache — Lagon7 DEV. Deux sites routés par PORT (marche avec l'IP
# du serveur, sans nom d'hôte) :
#   - Site public : port 80  -> publié 8089
#   - Extranet    : port 81  -> publié 8090
Listen 81

<VirtualHost *:80>
    ServerName lagon.dev
    DocumentRoot /var/www/html/current

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/current>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:81>
    ServerName lagon.dev
    DocumentRoot /var/www/html/current/extranet
    Alias /extranet /var/www/html/current/extranet

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/current/extranet>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
