# VirtualHost Apache — MGA DEV. DocumentRoot = racine de la source (bind-montée).
# HTTP simple : le code « raw » calcule ses URLs sur le schéma réel de la requête.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/current

    # Derrière l'edge : Traefik pose X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/current>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
