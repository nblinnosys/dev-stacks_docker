# VirtualHost Apache — Assurmix DEV (back-office « pro »). DocumentRoot = pro/.
# Le code utilise des URLs absolues "/pro/..." -> l'Alias /pro remappe vers le
# même dossier physique (sinon /pro/pro/... -> 404). Traefik ne route QUE /pro ici.
<VirtualHost *:80>
    ServerName assurmix.dev
    DocumentRoot /var/www/html/assurmix/pro

    # Derrière l'edge : Traefik pose X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    Alias /pro/ /var/www/html/assurmix/pro/
    Alias /pro  /var/www/html/assurmix/pro

    <Directory /var/www/html/assurmix/pro>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
