# VirtualHost Apache — ODC DEV.
#   :80  = servi DERRIÈRE Traefik/pfSense (edge). Traefik pose X-Forwarded-Proto:
#          https -> on expose HTTPS=on à PHP -> Laravel/Backpack génèrent des URLs
#          https (APP_URL=https://odc.<domaine>). C'est le chemin normal.
#   :443 = accès direct TLS auto-signé (debug local https://HOST:8443).
# DocumentRoot = public/ (code bind-monté).
<VirtualHost *:80>
    ServerName odc.dev
    DocumentRoot /var/www/html/odc/public

    # Derrière l'edge : X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/odc/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:443>
    ServerName odc.dev
    DocumentRoot /var/www/html/odc/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/html/odc/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
