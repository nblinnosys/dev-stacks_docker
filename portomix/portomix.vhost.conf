# VirtualHost Apache — Portomix DEV (DocumentRoot = racine du repo, bind-monté).
<VirtualHost *:80>
    ServerName portomix.dev
    DocumentRoot /var/www/html/portomix

    # Derrière l'edge : Traefik pose X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/portomix>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
