# VirtualHost Apache — mga-vitrine DEV. DocumentRoot = racine de la source.
# AllowOverride All : le .htaccess du dépôt pilote la réécriture (routeur bramus).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/current

    # Derrière l'edge : Traefik pose X-Forwarded-Proto https -> HTTPS=on pour PHP.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/current>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
